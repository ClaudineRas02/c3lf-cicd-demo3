<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculatrice</title>
  <style>
    body    { font-family:sans-serif; max-width:400px; margin:60px auto; text-align:center; padding:20px; }
    input   { width:80px; padding:10px; font-size:1rem; border:1px solid #d1d5db; border-radius:8px; margin:4px; }
    button  { padding:10px 18px; margin:4px; font-size:1rem; cursor:pointer;
               border:none; border-radius:8px; background:#2563eb; color:white; }
    #result { font-size:2rem; margin-top:24px; font-weight:bold; color:#2563eb; }
    .error  { color:#dc2626; }
  </style>
</head>
<body>
  <h1>Calculatrice</h1>
  <p style="color:#6b7280">Déployée automatiquement via GitHub Actions</p>
  <input id="a" type="number" placeholder="A">
  <input id="b" type="number" placeholder="B">
  <br><br>
  <button onclick="calc('+')">+</button>
  <button onclick="calc('-')">−</button>
  <button onclick="calc('*')">×</button>
  <button onclick="calc('/')">÷</button>
  <div id="result">—</div>
  <script src="app.js"></script>
</body>
</html>
